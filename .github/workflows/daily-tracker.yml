name: Daily Metrics Logger

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Tracker Script
        env:
          YT_KEY: ${{ secrets.YT_KEY || 'AIzaSyB7aAHA0NFJqfjELCvP-8mPGdMe5YVmcX4' }}
        run: node scripts/tracker.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update daily metrics" && git push)
