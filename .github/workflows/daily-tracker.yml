name: Daily Metrics Logger

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-metrics-logger
  cancel-in-progress: false

jobs:
  track-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Tracker Script
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
          IG_FEED_URL: ${{ secrets.IG_FEED_URL }}
        run: node scripts/tracker.js

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --staged --quiet; then
            echo "No changes to stats.json."
          else
            git commit -m "chore: auto-update daily metrics"
            git push
          fi
